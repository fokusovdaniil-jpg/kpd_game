<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимный Баттл 👑</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: left;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .criteria-box { margin-bottom: 15px; }
        .criteria-box label { display: block; font-size: 14px; margin-bottom: 5px; color: #aaa; }
    </style>
</head>
<body>

    <div id="screen-setup">
        <h2>👑 Вход в комнату</h2>
        <div class="card">
            <label>Твое имя:</label>
            <input type="text" id="p-name" placeholder="Например: Иван">
            
            <div id="girls-input-box">
                <h3 style="margin-top:15px;">Впиши 3 девушек для оценки:</h3>
                <input type="text" id="g-1" placeholder="Девушка 1 (Имя)">
                <input type="text" id="g-2" placeholder="Девушка 2 (Имя)">
                <input type="text" id="g-3" placeholder="Девушка 3 (Имя)">
            </div>
        </div>
        <button class="btn" onclick="startRoom()">Начать голосование</button>
    </div>

    <div id="screen-voting" style="display:none;">
        <h2>📝 Анонимное голосование</h2>
        <div id="voting-container"></div>
        <button class="btn" onclick="submitVotes()">Отправить голоса</button>
    </div>

    <div id="screen-waiting" style="display:none;">
        <h2>⏳ Ожидание игроков...</h2>
        <p>Голоса приняты. Ждем, пока остальные закончат оценку.</p>
        <button class="btn" onclick="checkResults()">Обновить результаты</button>
    </div>

    <div id="screen-results" style="display:none;">
        <h2>🏆 Итоги баттла</h2>
        <div class="card" id="results-box"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const SERVER_URL = "https://freeness-designate-entire.ngrok-free.dev";

        // Читаем код комнаты из параметров ссылки (?room=room_123)
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room') || "default_room";

        let myName = "";
        let girlsList = [];

        // Автозаполнение имени из Телеграма, если доступно
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('p-name').value = tg.initDataUnsafe.user.first_name;
        }

        async function startRoom() {
            myName = document.getElementById('p-name').value;
            
            let g1 = document.getElementById('g-1').value;
            let g2 = document.getElementById('g-2').value;
            let g3 = document.getElementById('g-3').value;

            if(!myName) {
                alert("Впиши свое имя!");
                return;
            }

            if(g1) {
                girlsList = [g1, g2, g3];
            }

            try {
                let response = await fetch(SERVER_URL + "/api/get_or_create_room", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ room_code: roomCode, player_name: myName, girls: girlsList })
                });
                
                let data = await response.json();
                
                if(data.status === "ok") {
                    buildVotingForm(data.room.girls);
                    document.getElementById('screen-setup').style.display = 'none';
                    document.getElementById('screen-voting').style.display = 'block';
                } else {
                    alert("Ошибка: " + JSON.stringify(data));
                }
            } catch (error) {
                alert("Ошибка соединения с сервером: " + error);
            }
        }

        function buildVotingForm(girls) {
            let container = document.getElementById('voting-container');
            container.innerHTML = "";

            girls.forEach((gName, gIdx) => {
                let html = `<div class="card">
                    <h3>🌸 ${gName}</h3>
                    <div class="criteria-box">
                        <label>1. Лицо (1-10):</label>
                        <select id="v-${gIdx}-1"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option></select>
                    </div>
                    <div class="criteria-box">
                        <label>2. Грудь (1-10):</label>
                        <select id="v-${gIdx}-2"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option></select>
                    </div>
                    <div class="criteria-box">
                        <label>3. Ягодицы (1-10):</label>
                        <select id="v-${gIdx}-3"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option></select>
                    </div>
                    <div class="criteria-box">
                        <label>4. Характер (1-10):</label>
                        <select id="v-${gIdx}-4"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option></select>
                    </div>
                    <div class="criteria-box">
                        <label>5. Дающая (0 или 10):</label>
                        <select id="v-${gIdx}-5"><option value="0">Нет (0)</option><option value="10" selected>Да (10)</option></select>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        async function submitVotes() {
            let votes = {};
            // Если список девушек пустой на клиенте, запрашиваем сервер
            try {
                let response = await fetch(SERVER_URL + "/api/get_or_create_room", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ room_code: roomCode, player_name: myName, girls: [] })
                });
                let data = await response.json();
                let currentGirls = data.room.girls;

                currentGirls.forEach((_, gIdx) => {
                    votes[gIdx] = {
                        1: document.getElementById(`v-${gIdx}-1`).value,
                        2: document.getElementById(`v-${gIdx}-2`).value,
                        3: document.getElementById(`v-${gIdx}-3`).value,
                        4: document.getElementById(`v-${gIdx}-4`).value,
                        5: document.getElementById(`v-${gIdx}-5`).value
                    };
                });

                await fetch(SERVER_URL + "/api/vote", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ room_code: roomCode, player_name: myName, votes: votes })
                });

                document.getElementById('screen-voting').style.display = 'none';
                document.getElementById('screen-waiting').style.display = 'block';
            } catch (error) {
                alert("Ошибка отправки голосов: " + error);
            }
        }

        async function checkResults() {
            try {
                let response = await fetch(SERVER_URL + "/api/get_results", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ room_code: roomCode })
                });
                let data = await response.json();

                if (data.status === "finished") {
                    let box = document.getElementById('results-box');
                    box.innerHTML = "";
                    data.results.forEach((res, idx) => {
                        let medal = idx === 0 ? "🥇 1 место" : idx === 1 ? "🥈 2 место" : "🥉 3 место";
                        box.innerHTML += `<p><strong>${medal}:</strong> ${res.name} — ${res.score} баллов</p>`;
                    });
                    document.getElementById('screen-waiting').style.display = 'none';
                    document.getElementById('screen-results').style.display = 'block';
                } else {
                    alert(`Еще не все проголосовали! Проголосовало: ${data.players_voted} / ${data.total_players}`);
                }
            } catch (error) {
                alert("Ошибка получения результатов: " + error);
            }
        }
    </script>
</body>
</html>
